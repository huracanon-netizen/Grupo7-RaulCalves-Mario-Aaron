<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyRoute Journey - Reservas</title>

<link rel="icon" type="image/x-icon" href="../img/Skye-route-Journey.ico">

<link rel="stylesheet" href="../CSS/Estilos.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>

<p>
<a href="index.html" class="sin-linea">
SkyRoute <span id="cafe">Journey</span>
</a>
</p>

<ul>
<li><a href="destinos.html">Destinos</a></li>
<li><a href="reservas.html">Reservas</a></li>
<li><a href="contacto.html">Contacto</a></li>
<li><a href="sobreNosotros.html">Sobre nosotros</a></li>
</ul>

</header>

<section id="cabecera-destinos">
<h1>Reserva tu viaje</h1>
<p>Completa el formulario y empieza tu aventura</p>
</section>

<section class="container my-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow p-4">

<form action="graciasreserva.html">

<div class="mb-3">
<label class="form-label">Nombre</label>
<input type="text" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Apellidos</label>
<input type="text" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Correo electrónico</label>
<input type="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Teléfono</label>
<input type="tel" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Destino</label>

<select id="destino" class="form-select" required>
<option value="">Selecciona destino</option>
<option value="paris">París</option>
<option value="roma">Roma</option>
<option value="tokio">Tokio</option>
<option value="bali">Bali</option>
<option value="dubai">Dubái</option>
<option value="nuevayork">Nueva York</option>
<option value="londres">Londres</option>
<option value="tailandia">Tailandia</option>
<option value="maldivas">Maldivas</option>
</select>

<p id="precio" style="font-weight:bold; margin-top:10px;"></p>
<small>*El precio puede variar según duración y número de personas</small>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Fecha ida</label>
<input type="date" id="fechaIda" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Fecha vuelta</label>
<input type="date" id="fechaVuelta" class="form-control" required>
</div>

</div>

<div class="mb-3">
<label class="form-label">Número de personas</label>
<input type="number" id="personas" class="form-control" min="1" max="10" required>
</div>

<div class="mb-3">
<label class="form-label">Comentarios</label>
<textarea class="form-control" rows="4"></textarea>
</div>

<div class="text-center">
<button type="submit" class="btn btn-warning px-5">
Enviar reserva
</button>
</div>

</form>

</div>
</div>
</div>
</div>

</section>

<footer>
© 2026 SkyRoute Journey | Agencia Oficial
</footer>

<script src="../JS/script.js"></script>

</body>

</html>
